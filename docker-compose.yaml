services:
  foundry:
    image: felddy/foundryvtt:release
    hostname: pol_foundryVTT
    volumes:
      # Volume Docker pour /data
      - foundry_data:/data
      # Bind Mount pour mapper tes fichiers locaux sur le dossier dist
      - ./dist/Data/systems/polaris:/data/Data/systems/polaris:cached
    environment:
      - FOUNDRY_PASSWORD=${FOUNDRY_PASSWORD}
      - FOUNDRY_USERNAME=${FOUNDRY_USERNAME}
      - FOUNDRY_HOT_RELOAD=true
    ports:
      - target: 30000
        published: 30000
        protocol: tcp

volumes:
  foundry_data:
    external: false
