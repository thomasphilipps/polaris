---

services:
  foundry:
    image: felddy/foundryvtt:release
    hostname: pol_foundryVTT
    volumes:
      - type: bind
        source: ./dist
        target: /data
    environment:
      - FOUNDRY_PASSWORD=${FOUNDRY_PASSWORD}
      - FOUNDRY_USERNAME=${FOUNDRY_USERNAME}
    ports:
      - target: 30000
        published: 30000
        protocol: tcp